    <sdpi-item label="">
      PotPlayer actions are sent directly to PotPlayer in the background (no focus needed, no

    <script>
      function updateVisibility(select) {
        document.querySelectorAll(`[data-for="${select.id}"]`).forEach((row) => {
          row.style.display = row.dataset.showWhen === select.value ? "" : "none";
        });
      }

      document.querySelectorAll('sdpi-select[id]').forEach((select) => {
        select.addEventListener("change", () => updateVisibility(select));
        updateVisibility(select);
      });
    </script>
